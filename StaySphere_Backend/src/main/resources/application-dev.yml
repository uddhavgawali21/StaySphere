spring:
  datasource:
    url: jdbc:mysql://localhost:3306/staysphere_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:staysphereSuperSecretKeyForJwtSigningMustBeLongEnough123456}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

payment:
  service:
    base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8081}