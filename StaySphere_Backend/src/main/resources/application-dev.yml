spring:
  datasource:
    url: jdbc:mysql://localhost:3306/staysphere_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Database-first: db/schema-design.sql is the single source of truth.
    # ddl-auto must stay "validate" so Hibernate checks the schema instead
    # of silently altering hand-maintained tables/columns.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:staysphereSuperSecretKeyForJwtSigningMustBeLongEnough123456}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

payment:
  service:
    base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8081}
    internal-api-key: ${INTERNAL_API_KEY:staysphere-college-project-internal-key-2026}
  token-amount: ${PAYMENT_TOKEN_AMOUNT:2000}