spring:
  datasource:
    url: jdbc:mysql://localhost:3306/staysphere_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: validate   # We control DDL manually / via entities+validate later. See explanation.
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:staysphereSuperSecretKeyForJwtSigningMustBeLongEnough123456}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}